name: 功能建议
description: 提出新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        建议先说明使用场景。架构相关的改动请先读 docs/ARCHITECTURE.md。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下需要这个功能？没有它时你怎么绕过的？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你期望它怎么工作？
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 主世界引擎（inject.js）
        - 隔离世界桥接（content.js）
        - 降级引擎（fallback.js）
        - 悬浮控制器 UI（floating.js）
        - 弹窗设置（popup/）
        - 打包工具（tools/）
        - 文档
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: 已知风险 / 顾虑
      description: 例如可能破坏哪些站点、与 MV3 的冲突、对狐猴浏览器（Chromium 107）的兼容性
    validations:
      required: false
